name: Validate Pack Sources

on:
  pull_request:

jobs:
  validate-ids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check _id presence and global uniqueness
        run: |
          ERRORS=0
          declare -A seen_ids

          while IFS= read -r -d '' file; do
            id=$(jq -r '._id // empty' "$file")

            if [[ -z "$id" ]]; then
              echo "::error file=$file::'$file' is missing top-level _id field"
              ERRORS=$((ERRORS + 1))
            elif [[ -n "${seen_ids[$id]+x}" ]]; then
              echo "::error file=$file::'$file' has duplicate _id '$id' (first seen in ${seen_ids[$id]})"
              ERRORS=$((ERRORS + 1))
            else
              seen_ids["$id"]="$file"
            fi
          done < <(find packs/_source -name '*.json' -print0)

          if [[ $ERRORS -gt 0 ]]; then
            echo "$ERRORS error(s) found in packs/_source."
            exit 1
          fi

          echo "All $(find packs/_source -name '*.json' | wc -l) files have a unique _id."

      - name: Check _id changes vs base branch
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1

          CHANGED=$(git diff --name-only "$BASE_REF...HEAD" -- 'packs/_source/*.json' 'packs/_source/**/*.json')

          ERRORS=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            current_id=$(jq -r '._id // empty' "$file" 2>/dev/null)
            base_content=$(git show "$BASE_REF:$file" 2>/dev/null) || continue
            base_id=$(echo "$base_content" | jq -r '._id // empty' 2>/dev/null)

            if [[ -n "$base_id" && -n "$current_id" && "$base_id" != "$current_id" ]]; then
              echo "::error file=$file::_id changed: '$base_id' -> '$current_id'"
              ERRORS=$((ERRORS + 1))
            fi
          done <<< "$CHANGED"

          if [[ $ERRORS -gt 0 ]]; then
            echo "$ERRORS _id change(s) detected. These are usually unintentional — verify before merging."
            exit 1
          else
            echo "No _id changes detected."
          fi
      - name: Validate JSON folders match folder id in same path
        run: |
          ERRORS=0
          while IFS= read -r -d '' file; do
            # skip _folder.json
            if [[ "$(basename "$file")" == "_folder.json" ]]; then
              continue
            fi
            folder=$(jq -r '.folder // empty' "$file")
            expected_folder_path=$(dirname "$file")
            if [[ -f "$expected_folder_path/_folder.json" ]]; then
              expected_folder_id=$(jq -r '._id' "$expected_folder_path/_folder.json")
              if [[ -n "$folder" && "$folder" != "$expected_folder_id" ]]; then
                echo "::error file=$file::Folder mismatch: top-level folder is '$folder', but expected folder id '$expected_folder_id'"
                ERRORS=$((ERRORS + 1))
              fi
            elif [[ -n "$folder" ]]; then
              echo "::error file=$file::Expected folder file '$expected_folder_path/_folder.json' not found. Folder '$folder'"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find packs/_source -name '*.json' -print0)

          if [[ $ERRORS -gt 0 ]]; then
            echo "$ERRORS JSON folder id mismatch error(s) found in packs/_source."
            exit 1
          fi

          echo "All $(find packs/_source -name '*.json' | wc -l) files have matching top-level folder ids."
